<?xml version="1.0" standalone="yes"?>
<driconf>
    <!-- No hardware blitter for tiled copies: without copy_image apps use shader/FBO blits instead of CPU untiling -->
    <device driver="panfrost">
        <application name="Default">
            <option name="mesa_extension_override" value="-GL_OES_copy_image -GL_EXT_copy_image -GL_NV_copy_image -GL_ARB_copy_image" />
        </application>
    </device>
</driconf>
