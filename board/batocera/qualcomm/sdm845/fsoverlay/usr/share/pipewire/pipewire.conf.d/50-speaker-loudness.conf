# compressor + lookahead limiter in front of the internal speakers only,
# headphones and HDMI stay unprocessed
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker loudness"
            media.name       = "Speaker loudness"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = comp
                        plugin = sc4_1882
                        label  = sc4
                        control = {
                            "RMS/peak"             = 0
                            "Attack time (ms)"     = 10
                            "Release time (ms)"    = 150
                            "Threshold level (dB)" = -18
                            "Ratio (1:n)"          = 3
                            "Knee radius (dB)"     = 6
                            "Makeup gain (dB)"     = 6
                        }
                    }
                    {
                        type   = ladspa
                        name   = lim
                        plugin = fast_lookahead_limiter_1913
                        label  = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 12
                            "Limit (dB)"       = -1
                            "Release time (s)" = 0.08
                        }
                    }
                ]
                links = [
                    { output = "comp:Left output"  input = "lim:Input 1" }
                    { output = "comp:Right output" input = "lim:Input 2" }
                ]
                inputs  = [ "comp:Left input" "comp:Right input" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "effect_input.speaker_loudness"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "speaker-loudness"
                filter.smart.target = {
                    node.name = "alsa_output._sys_devices_platform_sound_sound_card0.HiFi__Speaker__sink"
                }
            }
            playback.props = {
                node.name    = "effect_output.speaker_loudness"
                node.passive = true
            }
        }
    }
]
