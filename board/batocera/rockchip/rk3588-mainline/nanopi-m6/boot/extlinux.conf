TIMEOUT 10
DEFAULT batocera.linux

MENU TITLE boot menu

LABEL batocera.linux
  MENU LABEL batocera.linux
  LINUX /boot/linux
  FDTDIR /boot
  APPEND initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=ttyS2,1500000n8 coherent_pool=2M

LABEL batocera.linux.hdmi
  MENU LABEL batocera.linux on HDMI only
  LINUX /boot/linux
  FDT /boot/rk3588s-nanopi-m6.dtb
  APPEND initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=ttyS2,1500000n8 coherent_pool=2M

LABEL batocera.linux.dsi1
  MENU LABEL batocera.linux with display on dsi1
  LINUX /boot/linux
  FDT /boot/rk3588s-nanopi-m6-yx35-dsi1.dtb
  APPEND initrd=/boot/initrd.lz4 label=BATOCERA rootwait quiet loglevel=0 console=ttyS2,1500000n8 coherent_pool=2M

LABEL batocera.linux.dsi0
  MENU LABEL batocera.linux with display on dsi0
  LINUX /boot/linux
  FDT /boot/rk3588s-nanopi-m6-yx35-dsi0.dtb
