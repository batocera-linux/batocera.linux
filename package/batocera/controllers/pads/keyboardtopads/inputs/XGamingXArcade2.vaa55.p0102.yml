# XArcade Tankstick Max
target_devices:
- name: Tankstick Max Player 1
  type: joystick
  mapping:
    key:up: abs:hat0y:-1
    key:down: abs:hat0y:1
    key:left: abs:hat0x:-1
    key:right: abs:hat0x:1
    key:leftshift: btn:south
    key:z: btn:east
    key:leftctrl: btn:west
    key:leftalt: btn:north
    key:space: btn:tl
    key:x: btn:tr
    key:5: btn:start
    key:c: btn:select
    key:3: btn:tl
    key:4: btn:tr
- name: Tankstick Max Player 2
  type: joystick
  mapping:
    key:r: abs:hat0y:-1
    key:f: abs:hat0y:1
    key:d: abs:hat0x:-1
    key:g: abs:hat0x:1
    key:w: btn:south
    key:e: btn:east
    key:a: btn:west
    key:s: btn:north
    key:q: btn:tl
    key:leftbrace: btn:tr
    key:6: btn:start
    key:rightbrace: btn:select
- name: Tankstick Max hotkeys
  type: hotkeys
  mapping:
    key:1: key:context_menu
    key:2: key:pause
