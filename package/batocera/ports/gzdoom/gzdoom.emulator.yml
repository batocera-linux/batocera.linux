shared_features:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - gamescope
  - gamescope_nested_resolution
  - gamescope_output_resolution
  - gamescope_nested_refresh
  - gamescope_framerate_limit
  - gamescope_scaler
  - gamescope_filter
  - gamescope_sharpness
  - gamescope_reshade_effect
  - gamescope_hdr
  - gamescope_sdr_gamut_wideness
  - gamescope_hdr_sdr_content_nits
  - gamescope_hdr_itm_enabled
  - gamescope_hdr_itm_sdr_nits
  - gamescope_hdr_itm_target_nits
features:
  - padtokeyboard
custom_features:
  gz_api:
    prompt: GRAPHICS API
    description: Choose which graphics API library to use.
    choices:
      OpenGL (Default): 0
      Vulkan: 1
  gz_vsync:
    prompt: VSYNC
    description: Fix screen tearing. With Some games you need to turn VSync on in the games options.
    choices:
      Disabled: false
      Enabled: true
systems:
  - gzdoom
