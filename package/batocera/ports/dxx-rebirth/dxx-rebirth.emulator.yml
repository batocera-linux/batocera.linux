features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - gamescope
  - gamescope_nested_resolution
  - gamescope_output_resolution
  - gamescope_nested_refresh
  - gamescope_framerate_limit
  - gamescope_scaler
  - gamescope_filter
  - gamescope_sharpness
  - gamescope_reshade_effect
  - gamescope_hdr
  - gamescope_sdr_gamut_wideness
  - gamescope_hdr_sdr_content_nits
  - gamescope_hdr_itm_enabled
  - gamescope_hdr_itm_sdr_nits
  - gamescope_hdr_itm_target_nits
custom_features:
  rebirth_vsync:
    prompt: VSYNC
    description: Fix screen tearing.
    choices:
      Disabled (Default): 0
      Enabled: 1
  rebirth_filtering:
    prompt: TEXTURE FILTERING
    description: Smooth textures on 3D objects.
    choices:
      Classic (Default): 0
      Blocky Filtered: 1
      Smooth: 2
  rebirth_anisotropy:
    prompt: ANISOTROPIC FILTERING
    description: Improves clarity of distant textures.
    choices:
      Disabled (Default): 0
      Enabled: 1
  rebirth_multisample:
    prompt: 4x MULTISAMPLING
    choices:
      Disabled (Default): 0
      Enabled: 1
systems:
  - dxx-rebirth
