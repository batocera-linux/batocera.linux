shared_features:
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
features:
  - padtokeyboard
custom_features:
  smania_vsync:
    prompt: VSYNC
    description: Fix screen tearing.
    choices:
      Disabled: n
      Enabled: y
  smania_buffering:
    prompt: TRIPLE BUFFERING
    description: Enable triple buffering.
    choices:
      Disabled: n
      Enabled: y
  smania_ratio:
    prompt: GAME ASPECT RATIO
    description: Widescreen or the original 4:3 view.
    choices:
      "16:9": "16:9"
      "4:3": "4:3"
  smania_shader:
    prompt: SCREEN SHADER
    description: Apply one of the game's built-in shaders.
    choices:
      None: "0"
      Clean: "1"
      CRT Yeetron: "2"
      CRT Yee64: "3"
      YUV 420: "4"
      YUV 422: "5"
      YUV 444: "6"
      RGB Image: "7"
  smania_devmenu:
    prompt: DEVELOPER MENU
    description: Allow opening the developer menu.
    choices:
      "Off": n
      "On": y
  smania_language:
    prompt: LANGUAGE
    description: Change the game's language.
    choices:
      English: "0"
      French: "1"
      Italian: "2"
      German: "3"
      Spanish: "4"
      Japanese: "5"
      Korean: "6"
      Simplified Chinese: "7"
      Traditional Chinese: "8"
file_extensions:
  - sman
systems:
  - sonic-mania
