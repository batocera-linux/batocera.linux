features: []
shared_features:
  - powermode
  - cpucluster
  - tdp
  - platformprofile
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
custom_features:
  eka2l1_fps:
    prompt: FPS LIMIT
    description: Most games run as fast as the screen refreshes. N-Gage games are usually made for 30 fps or less; at 60 they run too fast. Saved in the game's EKA2L1 settings.
    choices:
      15: 15
      20: 20
      25: 25
      30: 30
      60: 60
      120: 120
  eka2l1_rtos_level:
    prompt: TIMING ACCURACY
    description: Accuracy of the emulated system timers. Lower is faster, higher fixes some games running too fast or too slow.
    choices:
      Low:  low
      Mid (Default): mid
      High: high
  eka2l1_integer_scaling:
    prompt: INTEGER SCALING
    description: Scale the screen by whole multiples only, for sharp pixels.
    preset: switchauto
  eka2l1_nearest_filter:
    prompt: NEAREST NEIGHBOR FILTERING
    description: Keep the pixels sharp when scaling the screen, instead of smoothing them.
    preset: switchauto
  eka2l1_language:
    prompt: SYSTEM LANGUAGE
    description: Language reported to the games. It has to be one the installed device firmware ships.
    choices:
      English: 1
      French: 2
      German: 3
      Spanish: 4
      Italian: 5
      Swedish: 6
      Danish: 7
      Norwegian: 8
      Finnish: 9
      Portuguese: 13
      Russian: 16
      Dutch: 18
file_extensions:
  - zip
  - json
  - sis
  - sisx
systems:
  - name: ngage
    file_extensions:
      - zip
      - json
    custom_features:
      eka2l1_ngage_device:
        prompt: N-GAGE MODEL
        description: Device used to run the game cards, when both are installed.
        choices:
          Auto: auto
          N-Gage QD (RH-29): RH-29
          N-Gage (NEM-4): NEM-4
  - name: symbian
    file_extensions:
      - sis
      - sisx
      - json
