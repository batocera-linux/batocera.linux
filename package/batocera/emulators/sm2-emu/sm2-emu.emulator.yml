features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
custom_features:
  sm2_graphics_backend:
    group: GRAPHICS
    prompt: GRAPHICS API
    description: Choose the rendering backend. Software is the current best option for Arm systems.
    choices:
      OpenGL: opengl
      Vulkan: vulkan
      Software: software
  sm2_render_scale:
    group: GRAPHICS
    prompt: RENDER SCALE
    description: Internal 3D render scale. OpenGL/Vulkan only, ignored on Software.
    choices:
      1x (Default): 1
      2x: 2
      3x: 3
      4x: 4
  sm2_scaling_method:
    group: GRAPHICS
    prompt: SCALING METHOD
    description: How the finished frame is magnified to the window.
    choices:
      Nearest: nearest
      Bilinear: bilinear
      Sharp Bilinear (Default): sharp
      Integer: integer
  sm2_aspect_mode:
    group: GRAPHICS
    prompt: ASPECT RATIO
    description: Which rectangle the frame is fit into.
    choices:
      4:3 (Default): '4:3'
      Square Pixel: square
      Stretch: stretch
  sm2_texture_filter:
    group: GRAPHICS
    prompt: 3D TEXTURE FILTER
    description: Anisotropic sharpens obliquely-viewed surfaces. OpenGL/Vulkan only, falls back to Faithful where unsupported.
    choices:
      Faithful (Default): faithful
      Anisotropic: anisotropic
  sm2_anisotropy:
    group: GRAPHICS
    prompt: ANISOTROPIC LEVEL
    description: Only applies when 3D texture filter is set to Anisotropic. Clamped to the GPU's max.
    choices:
      2x: 2
      4x (Default): 4
      8x: 8
      16x: 16
  sm2_upscale_2d:
    group: GRAPHICS
    prompt: 2D UPSCALE FILTER
    description: Edge-directed pixel-art filters over the 2D tilemap layers. OpenGL/Vulkan only, falls back to Faithful where unsupported.
    choices:
      Faithful (Default): faithful
      xBR: xbr
      ScaleFX: scalefx
  sm2_vsync:
    group: GRAPHICS
    prompt: VSYNC
    description: Sync to the display refresh to prevent tearing. Disable for VRR displays.
    choices:
      'On': 1
      Off (Default): 0
  sm2_lightgun_recoil:
    group: LIGHT GUN
    prompt: GUN RECOIL
    description: Fire the gun's recoil motor on each shot, for guns that have one.
    choices:
      Off: 0
      On (Default): 1
  sm2_lightgun_recoil_strength:
    group: LIGHT GUN
    prompt: GUN RECOIL STRENGTH
    choices:
      Light: 30
      Medium (Default): 60
      Strong: 90
  sm2_wheel_ffb:
    group: WHEEL
    prompt: WHEEL FORCE FEEDBACK
    description: Synthesised centring resistance on wheels that support it.
    choices:
      Off: 0
      On (Default): 1
  sm2_wheel_ffb_strength:
    group: WHEEL
    prompt: WHEEL FORCE FEEDBACK STRENGTH
    choices:
      Light: 15
      Medium (Default): 30
      Strong: 50
  sm2_wheel_rumble:
    group: WHEEL
    prompt: WHEEL ROAD RUMBLE
    description: Synthesised road/engine vibration while driving.
    choices:
      Off: 0
      On (Default): 1
  sm2_wheel_rumble_strength:
    group: WHEEL
    prompt: WHEEL RUMBLE STRENGTH
    choices:
      Light: 20
      Medium (Default): 40
      Strong: 60
  sm2_pad_rumble:
    group: GAMEPAD
    prompt: GAMEPAD RUMBLE
    description: The game's jolts plus a buzz rising with steering, on a regular gamepad. Driving games only.
    choices:
      Off: 0
      On (Default): 1
  sm2_pad_rumble_strength:
    group: GAMEPAD
    prompt: GAMEPAD RUMBLE STRENGTH
    choices:
      Light: 30
      Medium (Default): 60
      Strong: 90
  sm2_crt_enabled:
    group: CRT FILTER
    prompt: CRT FILTER
    description: Cosmetic scanline/mask/glow/curvature filter over the finished frame.
    choices:
      Off (Default): 0
      'On': 1
  sm2_crt_scanline_strength:
    group: CRT FILTER
    prompt: SCANLINE STRENGTH
    choices:
      Light: 20
      Medium (Default): 40
      Strong: 60
  sm2_crt_mask_strength:
    group: CRT FILTER
    prompt: MASK STRENGTH
    choices:
      Light: 15
      Medium (Default): 30
      Strong: 45
  sm2_crt_glow_strength:
    group: CRT FILTER
    prompt: GLOW STRENGTH
    choices:
      Light: 10
      Medium (Default): 20
      Strong: 30
  sm2_crt_curvature:
    group: CRT FILTER
    prompt: CURVATURE
    choices:
      Off (Default): 0
      Light: 15
      Strong: 30
systems:
  - model2
