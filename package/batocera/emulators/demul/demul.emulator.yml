file_extensions:
  - zip
  - 7z
cores:
  demul:
    shared_features:
      - powermode
      - cpucluster
      - tdp
      - platformprofile
      - videomode
    custom_features:
      demulRatio:
        prompt: GAME ASPECT RATIO
        choices:
          "Stretch": 0
          "4:3 (Default)": 1
          "16:9": 2
      demulVSync:
        prompt: VSYNC
        description: Fix screen tearing.
        choices:
          "Off": 0
          "On": 1
    systems:
      - name: cave3rd
