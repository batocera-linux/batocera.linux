features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
custom_features:
  openmsx_loading:
    prompt: LOADING SPEED
    description: This can be convenient if you're using laserdiscs.
    choices:
      Realistic Loading: "false"
      Full Speed (Default): "true"
  openmsx_disk:
    prompt: DISK TYPE
    description: Choose the appropriate media for disk image.
    choices:
      Floppy Disk Image: disk
      Hard Disk Image: hda
file_extensions:
  - zip
  - 7z
systems:
  - name: colecovision
    file_extensions:
      add:
        - bin
        - col
        - rom
  - name: msx1
    file_extensions: &msx1
      add:
        - dsk
        - mx1
        - rom
        - cas
        - ogv
        - openmsx
  - name: msx2
    file_extensions: &msx2
      values: *msx1
      remove:
        - mx1
      add:
        - mx2
  - name: msx2+
    file_extensions: &msx2plus
      values: *msx2
      remove:
        - ogv
  - name: msxturbor
    file_extensions:
      values: *msx2plus
      remove:
        - cas
      add:
        - m3u
  - name: spectravideo
    file_extensions:
      add:
        - cas
