features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - gamescope
  - gamescope_nested_resolution
  - gamescope_output_resolution
  - gamescope_nested_refresh
  - gamescope_framerate_limit
  - gamescope_scaler
  - gamescope_filter
  - gamescope_sharpness
  - gamescope_reshade_effect
  - gamescope_hdr
  - gamescope_sdr_gamut_wideness
  - gamescope_hdr_sdr_content_nits
  - gamescope_hdr_itm_enabled
  - gamescope_hdr_itm_sdr_nits
  - gamescope_hdr_itm_target_nits
custom_features:
  openmsx_loading:
    prompt: LOADING SPEED
    description: This can be convenient if you're using laserdiscs.
    choices:
      Realistic Loading: "false"
      Full Speed (Default): "true"
  openmsx_disk:
    prompt: DISK TYPE
    description: Choose the appropriate media for disk image.
    choices:
      Floppy Disk Image: disk
      Hard Disk Image: hda
systems:
  - colecovision
  - name: msx1
    exclude_extensions:
      - m3u
  - name: msx2
    exclude_extensions:
      - m3u
  - name: msx2+
    exclude_extensions:
      - m3u
  - msxturbor
  - spectravideo
