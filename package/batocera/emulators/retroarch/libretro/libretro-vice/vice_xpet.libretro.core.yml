features:
  - padtokeyboard
shared_features:
  - rewind
  - autosave
custom_features:
  pet_model:
    prompt: MODEL TYPE
    choices:
      "8032": 8032
      "2001": 2001
      "3008": 3008
      "3016": 3016
      "3032": 3032
      3032B: 3032B
      "4016": 4016
      "4032": 4032
      4032B: 4032B
      "8096": 8096
      "8296": 8296
      SUPERPET: SUPERPET
  vice_pet_external_palette:
    prompt: COLOR FILTER
    description: Can be used to simulate colors of particular displays.
    choices:
      default: default
      green: green
      amber: amber
      white: white
  vice_zoom_mode:
    group: ADVANCED OPTIONS
    prompt: ZOOM/CROP (HIDE BORDERS)
    description: Hides borders on many games. Some games used the borders.
    choices:
      Auto-disable zoom: auto_disable
      Auto zoom: automatic
      'Off': disabled
      small: small
      medium: medium
      maximum: maximum
  vice_keyboard_pass_through:
    group: ADVANCED OPTIONS
    prompt: KEYBOARD PASSTHROUGH
    description: Keyboard shortcuts unavailable if passing through the keyboard.
    choices:
      'Off': disabled
      'On': enabled
file_extensions:
  - a0
  - b0
  - crt
  - d64
  - d81
  - prg
  - tap
  - t64
  - m3u
  - zip
  - 7z
systems:
  - pet
