features:
  - netplay
  - cheevos
shared_features:
  - autosave
custom_features:
  picodrive_sprlim:
    prompt: REDUCE SPRITE FLICKERING
    description: Enhancement. Remove the eighty sprites per line limit.
    choices:
      'Off': disabled
      'On': enabled
  picodrive_renderer:
    group: ADVANCED OPTIONS
    prompt: VIDEO RENDERER
    description: Accurate is the slowest but most exact. Good and Fast are quicker but break games that change colours or sprites mid-frame.
    choices:
      Accurate: accurate
      Good: good
      Fast: fast
  pd_controller1_mapping:
    submenu: CONTROLLERS
    prompt: CONTROLLER 1 INPUT MAPPING
    description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
    choices:
      Retropad (Default): retropad
      Megadrive: megadrive
  pd_controller2_mapping:
    submenu: CONTROLLERS
    prompt: CONTROLLER 2 INPUT MAPPING
    description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
    choices:
      Retropad (Default): retropad
      Megadrive: megadrive
  pd_controller3_mapping:
    submenu: CONTROLLERS
    prompt: CONTROLLER 3 INPUT MAPPING
    description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
    choices:
      Retropad (Default): retropad
      Megadrive: megadrive
  pd_controller4_mapping:
    submenu: CONTROLLERS
    prompt: CONTROLLER 4 INPUT MAPPING
    description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
    choices:
      Retropad (Default): retropad
      Megadrive: megadrive
  picodrive_controller1:
    submenu: CONTROLLERS
    prompt: CONTROLLER 1 TYPE
    choices:
      Joypad 3 Button: 3 button pad
      Joypad 6 Button: 6 button pad
  picodrive_controller2:
    submenu: CONTROLLERS
    prompt: CONTROLLER 2 TYPE
    choices:
      Joypad 3 Button: 3 button pad
      Joypad 6 Button: 6 button pad
file_extensions:
  - bin
  - zip
  - 7z
systems:
  - name: gamegear
    file_extensions:
      add:
        - gg
  - name: mastersystem
    file_extensions:
      add:
        - sms
  - name: megacd
    file_extensions:
      - cue
      - iso
      - chd
      - m3u
  - name: megadrive
    file_extensions:
      add:
        - gen
        - md
        - sg
        - smd
  - name: pico
    file_extensions:
      add:
        - md
  - name: sega32x
    file_extensions:
      add:
        - 32x
        - chd
        - smd
        - md
    custom_features:
      picodrive-autowidescreen:
        prompt: AUTO WIDESCREEN
        description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
        choices:
          'Off': "False"
          'On': "True"
