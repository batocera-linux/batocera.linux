features:
  - padtokeyboard
  - cheevos
shared_features:
  - autosave
custom_features:
  usefastblitter:
    group: ADVANCED OPTIONS
    prompt: FAST BLITTER (LESS COMPATIBLE)
    description: For weak machines. Some games will not work with this.
    choices:
      'Off': disabled
      'On': enabled
  bios_vj:
    prompt: SHOW BIOS BOOTLOGO
    description: Off is safer, On for specific games.
    choices:
      Show: enabled
      Skip: disabled
  virtualjaguar_internal_resolution:
    prompt: INTERNAL RESOLUTION
    description: Render at a multiple of the native resolution.
    choices:
      1x (native): 1x
      2x: 2x
systems:
  - name: jaguar
    file_extensions:
      - j64
      - jag
      - cof
      - abs
      - rom
      - zip
  - name: jaguarcd
    file_extensions:
      - cue
      - cdi
      - bigpimg
