shared_features:
  - autosave
custom_features:
  resolution_mode:
    prompt: RENDERING RESOLUTION
    description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
    choices:
      1x (320x240): original
      2x (640x480): 2x
      4x (1280x960): 4x
      720p: 720p
      1080p: 1080p
      4K: 4k
  yabasanshiro_rbg_resolution:
    prompt: ROTATING BACKGROUND RESOLUTION
    description: Enhancement. Render the rotating background (RBG) layer at a higher resolution. Demanding on weaker devices.
    choices:
      Original (Default): original
      2x: 2x
      720p: 720p
      1080p: 1080p
      Fit To Rendering Resolution: Fit_to_emulation
  yabasanshiro-autowidescreen:
    prompt: AUTO WIDESCREEN
    description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
    choices:
      'Off': "False"
      'On': "True"
  multitap_yabasanshiro:
    prompt: MULTITAP
    description: Allows up to 7 or 12 controllers in supported games.
    choices:
      'Off': disabled
      Port1: port1
      Port2: port2
      Port1+2: port12
  controller1_saturn:
    prompt: CONTROLLER 1 TYPE
    description: Not all games support 3D pad.
    choices:
      Saturn Pad: 1
      Saturn 3D Pad: 261
  controller2_saturn:
    prompt: CONTROLLER 2 TYPE
    description: Not all games support 3D pad.
    choices:
      Saturn Pad: 1
      Saturn 3D Pad: 261
  yabasanshiro_language:
    prompt: LANGUAGE
    description: Change the system's language.
    choices:
      English (Default): english
      Spanish: spanish
      French: french
      Deutsch: deutsch
      Italian: italian
      Japanese: japanese
file_extensions:
  - cue
  - ccd
  - chd
  - iso
  - zip
  - mds
systems:
  - saturn
