features:
  - netplay
  - cheevos
shared_features:
  - rewind
  - autosave
custom_features:
  wswan_rotate_display:
    prompt: DISPLAY ROTATION
    decription: Initial orientation of the game & controls
    choices:
      Manual: manual
      Portrait: portrait
      Landscape: landscape
file_extensions:
  - zip
  - 7z
systems:
  - name: wswan
    file_extensions:
      add:
        - ws
  - name: wswanc
    file_extensions:
      add:
        - wsc
