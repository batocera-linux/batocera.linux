features:
  - netplay
  - cheevos
shared_features:
  - rewind
  - autosave
custom_features:
  pce_nospritelimit:
    prompt: REDUCE SPRITE FLICKERING
    description: Enhancement. Remove the sixteen sprites per line limit.
    choices:
      'Off': disabled
      'On': enabled
  controller1_pce:
    prompt: CONTROLLER 1 TYPE
    choices:
      PCE Joypad: 1
      PCE Mouse: 2
systems:
  - name: pcengine
    file_extensions:
      - pce
      - bin
      - zip
      - 7z
  - name: pcenginecd
    file_extensions:
      - pce
      - cue
      - ccd
      - iso
      - img
      - chd
