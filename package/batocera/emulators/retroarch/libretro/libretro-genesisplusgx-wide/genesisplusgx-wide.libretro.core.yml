features:
  - netplay
  - cheevos
shared_features:
  - rewind
  - autosave
file_extensions:
  - md
  - zip
  - 7z
systems:
  - name: megadrive
    file_extensions:
      add:
        - bin
        - gen
        - sg
        - smd
  - name: megadrive-msu
    file_extensions:
      add:
        - squashfs
  - name: pico
    file_extensions:
      add:
        - bin
