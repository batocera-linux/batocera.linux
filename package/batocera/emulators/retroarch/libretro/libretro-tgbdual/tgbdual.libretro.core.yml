features:
  - netplay
shared_features:
  - rewind
  - autosave
custom_features:
  sync_saves:
    group: ADVANCED OPTIONS
    prompt: SYNC SAVE FILES
    description: Sync GB2Player/GBC2Player saves with saves in "saves/gb" or "saves/gbc".
    choices:
      'On': 1
      'Off': 0
file_extensions:
  - gb2
  - gbc2
  - zip
  - 7z
systems:
  - name: gb2players
    file_extensions:
      add:
        - gb
  - name: gbc2players
    file_extensions:
      add:
        - gbc
