features:
  - padtokeyboard
  - cheevos
shared_features:
  - rewind
  - autosave
custom_features:
  bluemsx_overscan:
    prompt: ZOOM (HIDE BORDERS)
    description: Hides borders on many games. Some games used the borders.
    choices:
      'Off': disabled
      'On': enabled
      MSX2: MSX2
  bluemsx_nospritelimits:
    prompt: REDUCE SPRITE FLICKERING
    description: Enhancement. Remove the four sprites per line limit.
    choices:
      'Off': false
      'On': true
file_extensions:
  - zip
  - 7z
systems:
  - name: colecovision
    file_extensions:
      add:
        - bin
        - col
        - rom
  - name: msx1
    file_extensions: &msx1
      add:
        - dsk
        - mx1
        - rom
        - cas
        - m3u
  - name: msx2
    file_extensions:
      values: *msx1
      remove:
        - mx1
      add:
        - mx2
        - ogv
  - name: msx2+
    file_extensions: &msx2plus
      values: *msx1
      remove:
        - mx1
      add:
        - mx2
  - name: msxturbor
    file_extensions:
      values: *msx2plus
      remove:
        - cas
  - name: spectravideo
    file_extensions:
      add:
        - cas
