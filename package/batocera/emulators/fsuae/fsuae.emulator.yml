features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - ratio
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
file_extensions:
  - adf
  - uae
  - ipf
  - dms
  - dmz
  - adz
  - lha
  - hdf
  - exe
  - m3u
  - zip
  - raw
  - scp
systems:
  - name: amiga1200
    as_core:
      - A1200
      - A4000
  - name: amiga500
    as_core:
      - A1000
      - A3000
      - A500
      - A500+
      - A600
  - name: amigacd32
    as_core: CD32
    file_extensions: &amigacd32
      - bin
      - cue
      - iso
      - chd
  - name: amigacdtv
    as_core: CDTV
    file_extensions:
      values: *amigacd32
      add:
        - m3u
