shared_features:
  - powermode
  - tdp
  - platformprofile
  - cpucluster
  - videomode
  - hud
  - hud_corner
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
custom_features:
  odin_api:
    group: GRAPHICS
    prompt: GRAPHICS API
    description: The renderer. Odin falls back to OpenGL if Vulkan fails.
    choices:
      Vulkan (Default): vulkan
      OpenGL: opengl
  odin_scale:
    group: GRAPHICS
    prompt: INTERNAL RESOLUTION
    description: Draw the 3D at a multiple of 640x480.
    choices:
      1x (Default): 1
      2x: 2
      3x: 3
      4x: 4
      5x: 5
      6x: 6
  odin_upscale_mode:
    group: GRAPHICS
    prompt: UPSCALING MODE
    description: How the HUD and text are drawn above 1x. Smooth can show thin seams.
    choices:
      Smooth (Default): raw
      Snap to Pixels: snap
      Original Pixels: native
  odin_anisotropy:
    group: GRAPHICS
    prompt: ANISOTROPIC FILTERING
    description: Sharpen textures seen at an angle. The original board has none.
    choices:
      Off (Default): 1
      2x: 2
      4x: 4
      8x: 8
      16x: 16
  odin_vsync:
    group: GRAPHICS
    prompt: VSYNC
    description: Sync frames to the display to stop screen tearing.
    choices:
      Off (Default): "off"
      On: "on"
      Adaptive: adaptive
  odin_bezel:
    group: GRAPHICS
    prompt: BEZELS
    choices:
      On (Default): image
      Blurred Sides: blur
      Off: "off"
  odin_filter:
    group: GRAPHICS
    prompt: CRT FILTER
    description: Apply filters to look like the original displays. Needs a fast GPU.
    choices:
      Off (Default): none
      Sega 29" monitor: lola-retro/sega-monitor-29
      Sega 50" projector: lola-retro/sega-projector-50
      Gaelco 28" monitor: lola-retro/gaelco-monitor-28
      Gaelco 34" monitor: lola-retro/gaelco-monitor-34
  odin_vibration:
    group: CONTROLS
    prompt: VIBRATION
    description: Vibrate the controller as the original board does for effects. Needs a controller that supports vibration.
    choices:
      On (Default): "on"
      Off: "off"
  odin_vibration_force:
    group: CONTROLS
    prompt: VIBRATION STRENGTH
    description: How hard the controller vibrates.
    choices:
      25%: 25
      50%: 50
      75%: 75
      100% (Default): 100
      150%: 150
      200%: 200
  odin_dead_zone:
    group: CONTROLS
    prompt: STICK DEAD ZONE
    description: How far a controller's stick moves before the game sees it.
    choices:
      Off: 0
      3% (Default): 3
      5%: 5
      10%: 10
      15%: 15
      20%: 20
      30%: 30
  odin_trigger_threshold:
    group: CONTROLS
    prompt: TRIGGER THRESHOLD
    description: How far a controller's trigger is pulled before it presses a button.
    choices:
      Off: 0
      3% (Default): 3
      5%: 5
      10%: 10
      20%: 20
      30%: 30
      50%: 50
  odin_service_buttons:
    group: CONTROLS
    prompt: SERVICE AND TEST BUTTONS
    description: Service on L3 and Test on R3, to open the test menu.
    preset: switchauto
  odin_wheel_force:
    group: WHEELS
    prompt: WHEEL FORCE
    description: How hard the force feels when turning the wheel.
    choices:
      25%: 25
      50%: 50
      75%: 75
      100% (Default): 100
      150%: 150
      200%: 200
file_extensions:
  - zip
  - 7z
systems:
  - name: hikaru
    custom_features:
      odin_light_gun_mode:
        group: LIGHT GUN
        prompt: BRAVE LIGHT GUN MODE
        description: Aim with the mouse or light gun.
        choices:
          On (Default): "on"
          Off: "off"
      odin_pharrier_stick:
        group: CONTROLS
        prompt: PLANET HARRIERS STICK
        description: Pull back to climb, as on the cabinet, or push up to climb.
        choices:
          Pull Back to Climb (Default): standard
          Push Up to Climb: inverted
      odin_nascar_cabinet:
        group: CABINET
        prompt: NASCAR CABINET
        description: Deluxe has bass shakers in the seat, so the controller rumbles with the game's sound.
        choices:
          Standard (Default): standard
          Deluxe: deluxe
      odin_swracer_cabinet:
        group: CABINET
        prompt: STAR WARS RACER CABINET
        description: Mini Deluxe has no second sound board, so the sound is simpler and the controller rumbles with the main sound.
        choices:
          Standard (Default): standard
          Mini Deluxe: minideluxe
      odin_sound_mode:
        group: SOUND
        prompt: SOUND OUTPUT
        description: Planet Harriers, NASCAR and Star Wars Racer have extra sound for the back of the cabinet.
        choices:
          Stereo: mix
          4 Speakers: quad
          Front Only: main
  - name: gaelco
    custom_features:
      odin_atvtrack_cabinet:
        group: CABINET
        prompt: ATV TRACK CABINET
        description: The controller rumbles as the moving platform tilts, or with the Vibrator's seat motor.
        choices:
          Standard (Default): standard
          Vibrator: vibrator
      odin_smashdrv_cabinet:
        group: CABINET
        prompt: SMASHING DRIVE CABINET
        description: Upright is played standing, with no seat motor, so the controller doesn't rumble.
        choices:
          Standard (Default): standard
          Upright: upright
      odin_sound_mode:
        group: SOUND
        prompt: SOUND OUTPUT
        description: The cabinet has a bass speaker. 4 Speakers plays it from the back.
        choices:
          Stereo (Default): mix
          4 Speakers: quad
          No Bass Speaker: main
