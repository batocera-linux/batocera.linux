features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - ratio
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - gamescope
  - gamescope_nested_resolution
  - gamescope_output_resolution
  - gamescope_nested_refresh
  - gamescope_framerate_limit
  - gamescope_scaler
  - gamescope_filter
  - gamescope_sharpness
  - gamescope_reshade_effect
  - gamescope_hdr
  - gamescope_sdr_gamut_wideness
  - gamescope_hdr_sdr_content_nits
  - gamescope_hdr_itm_enabled
  - gamescope_hdr_itm_sdr_nits
  - gamescope_hdr_itm_target_nits
systems:
  - name: dos
    exclude_extensions:
      - zip
custom_features:
  dosbox_staging_writes_to_rom:
    prompt: Enable writable overlay for squashfs ROMs
    description: Writes are saved per-game in saves/dos/game-rom-name
    choices:
      Enabled: True
      Disabled: False
