features: []
shared_features:
  - powermode
  - cpucluster
  - tdp
  - platformprofile
  - videomode
custom_features:
  xenia_license:
    prompt: XBOX LIVE ARCADE
    description: This option enables the ability to play Xbox Live Arcade games. May cause compatibility issues with non-XBLA games.
    choices:
      No licenses enabled: 0
      XBLA license enabled (Default): 1
      All possible licenses (Not recommended): -1
  xenia_resolution:
    group: DISPLAY OPTIONS
    prompt: INTERNAL DISPLAY RESOLUTION
    description: Allow game that support different resolutions to be rendered in specific resolution.
    choices:
      640x480: 0
      640x576: 1
      720x480: 2
      720x576: 3
      800x600: 4
      848x480: 5
      1024x768: 6
      1152x864: 7
      1280x720 (Default): 8
      1280x768: 9
      1280x960: 10
      1280x1024: 11
      1360x768: 12
      1440x900: 13
      1680x1050: 14
      1920x540: 15
      1920x1080: 16
  xenia_api:
    group: DISPLAY OPTIONS
    prompt: GRAPHICS API
    description: Choose which graphics API library to use. D3D12 may yield better results with faster GPUs.
    choices:
      D3D12 (Default): D3D12
      Native Vulkan: Vulkan
  xenia_vsync:
    group: DISPLAY OPTIONS
    prompt: VSYNC
    description: Fix screen tearing. With Some games you need to turn VSync on in the games options.
    choices:
      Disabled: false
      Enabled: true
  xenia_vsync_fps:
    group: DISPLAY OPTIONS
    prompt: VSYNC FPS
    description: Manually set VSYNC frames per second. Ideally this should match your monitor refresh rate.
    choices:
      50fps: 50
      60fps: 60
      120fps: 120
      144fps: 144
      165fps: 165
  xenia_headless:
    prompt: UI PROMPTS
    description: Choose to display UI prompts or accept defaults.
    choices:
      Enabled (Default): false
      Disabled: true
  xenia_achievement:
    prompt: SHOW ACHIEVEMENT MESSAGES
    description: Choose to display achievement messages in the UI.
    choices:
      Disabled: false
      Enabled: true
  xenia_patches:
    prompt: GAME PATCHES
    description: Enable or disable Xenia patches. These patches can fix graphics problems in some games.
    choices:
      Disabled (Default): false
      Enabled: true
  xenia_page_state:
    group: ADVANCED OPTIONS
    prompt: CLEAR MEMORY PAGE STATE
    description: Refresh state of memory pages to enable gpu written data. (Use for 'Team Ninja' Games to fix missing character models).
    choices:
      Disabled: false
      Enabled: true
  xenia_target_path:
    group: ADVANCED OPTIONS
    prompt: RENDER TARGET PATH
    description: Render target emulation path to use on Direct3D 12. Try changing if you have render issues.
    choices:
      Any: any
      RTV (Default): rtv
      ROV: rov
  xenia_limit_hard:
    group: ADVANCED OPTIONS
    prompt: HARD TEXTURE CACHE MEMORY LIMIT
    description: Maximum host texture memory usage (in megabytes) above which textures will be destroyed as soon as possible.
    choices:
      768MB (Default): 768
      1536MB: 1536
      2304MB: 2304
      3072MB: 3072
      3840MB: 3840
      4096MB: 4096
      5120MB: 5120
      6144MB: 6144
  xenia_limit_render_to_texture:
    group: ADVANCED OPTIONS
    prompt: TEXTURE MEMORY SCALE SIZE
    description: Part of the host texture memory budget (in megabytes) that will be scaled by the current drawing resolution scale.
    choices:
      24MB (Default): 24
      48MB: 48
      72MB: 72
      96MB: 96
  xenia_limit_soft:
    group: ADVANCED OPTIONS
    prompt: SOFT TEXTURE CACHE MEMORY LIMIT
    description: Maximum host texture memory usage (in megabytes) above which old textures will be destroyed. Set below hard limit.
    choices:
      384MB (Default): 384
      768MB: 768
      1536MB: 1536
      2048MB: 2048
      3072MB: 3072
      4096MB: 4096
  xenia_limit_soft_lifetime:
    group: ADVANCED OPTIONS
    prompt: SOFT TEXTURE CACHE MEMORY TIMEOUT
    description: Seconds a texture should be unused to be considered old enough to be deleted if texture memory usage exceeds Soft Texture Cache limit.
    choices:
      15s: 15
      30s (Default): 30
      45s: 45
      60s: 60
  xenia_cache:
    group: ADVANCED OPTIONS
    prompt: MOUNT CACHE
    description: Enable cache mount. Can improve performance and compatibility in some games.
    choices:
      Disabled: false
      Enabled: true
  xenia_postprocess_scaling_and_sharpening:
    group: DISPLAY OPTIONS
    prompt: POST-PROCESSING SCALING AND SHARPENING
    description: Upscaling and sharpening filter. CAS = AMD FidelityFX Contrast Adaptive Sharpening, FSR = AMD FidelityFX Super Resolution 1.0.
    choices:
      Bilinear (Default): bilinear
      CAS: cas
      FSR: fsr
  xenia_postprocess_antialiasing:
    group: DISPLAY OPTIONS
    prompt: POST-PROCESSING ANTI-ALIASING
    description: Post-processing anti-aliasing filter.
    choices:
      None (Default): none
      FXAA: fxaa
      FXAA Extreme: fxaa_extreme
  xenia_postprocess_ffx_cas_additional_sharpness:
    group: DISPLAY OPTIONS
    prompt: CAS ADDITIONAL SHARPNESS
    description: Additional sharpness for AMD FidelityFX CAS, from 0 to 1. Higher is sharper.
    preset: sliderauto
    preset_parameters: 0.0 1.0 0.1
  xenia_postprocess_ffx_fsr_sharpness_reduction:
    group: DISPLAY OPTIONS
    prompt: FSR SHARPNESS REDUCTION
    description: Sharpness reduction for AMD FidelityFX FSR 1.0, in stops. Lower is sharper.
    preset: sliderauto
    preset_parameters: 0.0 2.0 0.1
file_extensions:
  - iso
  - xex
  - xbox360
  - zar
systems:
  - xbox360
