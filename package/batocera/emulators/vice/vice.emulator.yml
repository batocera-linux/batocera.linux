features:
  - padtokeyboard
shared_features:
  - powermode
  - tdp
  - videomode
  - ratio
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
custom_features:
  noborder:
    group: ADVANCED OPTIONS
    prompt: ZOOM (HIDE BORDERS)
    description: Hides borders on many games. Some games used the borders.
    choices:
      NO (DEFAULT): 0
      'YES': 1
file_extensions:
  - d64
  - prg
  - zip
systems:
  - name: c128
    as_core: x128
    file_extensions:
      add:
        - d81
        - lnx
  - name: c20
    as_core: xvic
    file_extensions: &c20
      add:
        - rom
        - a0
        - b0
        - crt
        - d81
        - tap
        - t64
  - name: c64
    as_core:
      - x64
      - x64dtv
      - xscpu64
    file_extensions:
      add:
        - d71
        - d81
        - crt
        - tap
        - t64
        - nib
        - g64
  - name: cplus4
    as_core: xplus4
    file_extensions:
      add:
        - tap
  - name: pet
    as_core: xpet
    file_extensions:
      values: *c20
      remove:
        - rom
