custom_features:
  gamescope:
    prompt: GAMESCOPE
    description: Run the game inside gamescope, so its resolution and refresh changes never reach the display.
    group: GAMESCOPE
    choices:
      "Off": 0
      "On": 1
  gamescope_resolution:
    prompt: GAME RESOLUTION
    description: The resolution the game sees. Gamescope scales it to the display.
    group: GAMESCOPE
    choices:
      320x240: 320x240
      640x400: 640x400
      640x480: 640x480
      800x600: 800x600
      960x540: 960x540
      1024x768: 1024x768
      1152x864: 1152x864
      1280x720: 1280x720
      1280x800: 1280x800
      1280x960: 1280x960
      1280x1024: 1280x1024
      1366x768: 1366x768
      1440x900: 1440x900
      1600x900: 1600x900
      1600x1200: 1600x1200
      1680x1050: 1680x1050
      1920x1080: 1920x1080
      1920x1200: 1920x1200
      2560x1440: 2560x1440
      2560x1600: 2560x1600
      3840x2160: 3840x2160
  gamescope_scaler:
    prompt: SCALING
    group: GAMESCOPE
    choices:
      Fit: fit
      Integer: integer
      Fill: fill
      Stretch: stretch
  gamescope_filter:
    prompt: UPSCALE FILTER
    group: GAMESCOPE
    choices:
      Linear: linear
      Nearest: nearest
      FSR: fsr
      NIS: nis
      SGSR: sgsr
      Pixel: pixel
  gamescope_sharpness:
    prompt: UPSCALE SHARPNESS
    description: FSR, NIS and SGSR sharpness, from 0 (sharpest) to 20 (softest).
    group: GAMESCOPE
    choices:
      "0": 0
      "2": 2
      "5": 5
      "10": 10
      "20": 20
  gamescope_fps_limit:
    prompt: FRAME RATE LIMIT
    description: Rounds to the nearest whole divisor of the display refresh rate, so 40 needs a 120 Hz display.
    group: GAMESCOPE
    choices:
      "15": 15
      "20": 20
      "24": 24
      "30": 30
      "36": 36
      "40": 40
      "45": 45
      "48": 48
      "60": 60
      "72": 72
      "90": 90
      "120": 120
