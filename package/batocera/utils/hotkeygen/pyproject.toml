[project]
name = "hotkeygen"
version = '1.1'
dependencies = [
    'batocera-common',
    'pyudev; sys_platform == "linux"',
    'evdev; sys_platform == "linux"',
]

[project.scripts]
hotkeygen = "hotkeygen.daemon:main"
batocera-hotkeys = "hotkeygen.hotkeys:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/hotkeygen",
]
