[project]
name = "hotkeygen"
version = '1.1'
dependencies = [
    'batocera-common',
    'pyudev; sys_platform == "linux"',
    'evdev; sys_platform == "linux"',
    'dbus-fast',
    'uvloop',
]

[project.scripts]
hotkeygen = "hotkeygen.hotkeygen:main"
batocera-hotkeys = "hotkeygen.batocera_hotkeys:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/hotkeygen",
]
