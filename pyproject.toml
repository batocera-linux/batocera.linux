[dependency-groups]
dev = [
    "prek==0.5.3",
    "ruff==0.16.7",
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pyfakefs==6.2.0",
    "aiointercept==0.1.12",
    "coverage[toml]==7.16.1",
    "pygobject-stubs @ git+https://github.com/pygobject/pygobject-stubs.git@959c470767cd44a74912ba182e9fb202d0d96519",
]

[tool.uv]
package = false
# These versions need to be kept in sync with the versions
# built by buildroot
constraint-dependencies = [
    "pyyaml==6.0.3",
    "configobj==5.0.8",
    "evdev==1.9.3",
    "pillow==12.0.0",
    "pysdl2==0.9.17",
    "pyudev==0.24.4",
    "qrcode==8.2",
    "requests==2.33.1",
    "aiohttp==3.13.5",
    "aiodns==4.0.0",
    "brotli==1.2.0",
    "uvloop==0.22.1",
    "ruamel.yaml==0.19.0",
    "toml==0.10.2",
    "typing-extensions==4.15.0",
    "ffmpeg-python @ git+https://github.com/kkroening/ffmpeg-python.git@df129c7ba30aaa9ffffb81a48f53aa7253b0b4e6",
    "pygobject==3.56.3",
    "lazy-loader==0.5",
    "dbus-fast==4.0.4",
]
config-settings-package = { pygobject-stubs = { config = "Gtk3,Gdk3" } }

[tool.uv.sources]
batocera-common = { workspace = true }
batocera-launch = { workspace = true }
hotkeygen = { workspace = true }
batocera-launch-libretro = { workspace = true }
batocera-launch-mame-common = { workspace = true }
pytest-batocera-launch = { workspace = true }
pytest-batocera = { workspace = true }

[tool.uv.workspace]
members = [
    'python-src/*',
    './package/batocera/utils/hotkeygen',
]
exclude = ['python-src/stubs', 'python-src/scripts']

[tool.pytest]
minversion = "9.0"
addopts = [
    "--import-mode=importlib",
    "--cov",
    "--cov-branch",
    "--cov-report=term",
]
strict = true
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",  # ignore deprecation warnings from asyncio.iscoroutinefunction
]

[tool.coverage.run]
omit = ["**/python-src/*/tests/**", "**/hotkeygen/tests/**"]

[tool.coverage.report]
exclude_also = [
    "^if\\s+__name__\\s*==\\s*['\"]__main__['\"]:",
]

[tool.pyright]
include = [
    "python-src",
    "package/batocera/utils/hotkeygen",
]
exclude = [
    ".venv*",
    "buildroot*",
    "output",
    "dl",
    "python-src/stubs/configobj/validate.pyi",
]
stubPath = "python-src/stubs"

pythonVersion = "3.14"
pythonPlatform = "Linux"

typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingModuleSource = "none"
reportDeprecated = "warning"

reportUnnecessaryTypeIgnoreComment = "warning"
reportPrivateUsage = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportImportCycles = "none"
enableExperimentalFeatures = true
deprecateTypingAliases = true

enableTypeIgnoreComments = false  # Force pyright: ignore comments

[tool.ruff]
extend-exclude = [".venv*", "buildroot*", "output", "dl"]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "TC", "PYI", "I", "UP", "F", "FA", "E", "W", "B", "C4", "SIM", "PTH", "G", "PERF", "PIE", "RET", "PT", "RUF"
]
ignore = ["SIM105", "SIM108", "E501", "RUF051"]

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions", "_typeshed"]
known-first-party = [
    "batocera_common",
    "batocera_labwc",
    "batocera_launch",
    "batocera_launch_libretro",
    "batocera_launch_mame_common",
    "batocera_es_system"
]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
