[project]
name = "batocera-launch-openjkdf2"
version = '44.0'
dependencies = [
    'batocera-common',
    'batocera-launch',
]

[project.entry-points."batocera_launch.emulators"]
openjkdf2 = 'batocera_launch_openjkdf2:OpenJKDF2'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_openjkdf2"]
