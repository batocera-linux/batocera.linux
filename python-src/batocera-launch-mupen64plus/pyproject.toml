[project]
name = "batocera-launch-mupen64plus"
version = '44.0'
dependencies = [
    'batocera-common',
    'batocera-launch',
]

[project.entry-points."batocera_launch.emulators"]
mupen64plus = 'batocera_launch_mupen64plus:Mupen64Plus'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_mupen64plus"]
