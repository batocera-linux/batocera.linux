[project]
name = "batocera-launch"
version = '44.0'
dependencies = [
    'uvloop',
    'batocera-common',
]

[project.scripts]
batocera-launch = "batocera_launch.cli.main:main"
emulatorlauncher = "batocera_launch.cli.main:main"
batocera-joysticks-hotkeys = "batocera_launch.joysticks_hotkeys:main"

[project.entry-points."batocera_launch.emulators"]
lexaloffle = 'batocera_launch.emulators.lexaloffle:Lexaloffle'
