[project]
name = "batocera-launch-mame"
version = '44.0'
dependencies = [
    'batocera-common',
    'batocera-launch',
    'batocera-launch-mame-common',
]

[project.entry-points."batocera_launch.emulators"]
mame = 'batocera_launch_mame:MAME'

[project.entry-points."batocera_launch.plugins"]
mame-rotation = 'batocera_launch_mame.rotation:MameRotationPlugin'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_mame"]
