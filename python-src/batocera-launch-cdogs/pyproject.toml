[project]
name = "batocera-launch-cdogs"
version = '44.0'
license = 'LGPL-3.0-or-later'
dependencies = [
    'batocera-common',
    'batocera-launch',
]

[project.entry-points."batocera_launch.emulators"]
cdogs = 'batocera_launch_cdogs:CDogs'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_cdogs"]
