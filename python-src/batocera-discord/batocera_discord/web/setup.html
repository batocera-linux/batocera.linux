<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141519">
<title>Discord · Batocera</title>
<style>
:root{
  --bg:#0e0f13;--bg2:#1c1e27;--card:#20232c;--card2:#272a35;--line:rgba(255,255,255,.08);
  --text:#f0f2f6;--dim:#9aa0ae;--accent:#5865f2;--accent2:#7984ff;--green:#23a55a;--green2:#43d680;
  --red:#ed4245;--warn:#f0be5a;--radius:18px
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(900px 500px at 100% -10%,rgba(88,101,242,.28),transparent 60%),linear-gradient(var(--bg2),var(--bg) 70%);
  color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
main{max-width:560px;margin:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--accent2),var(--accent));display:grid;place-items:center;box-shadow:0 8px 24px rgba(88,101,242,.45)}
.logo svg{width:30px;height:30px}
h1{font-size:22px;line-height:1.2}
.sub{color:var(--dim);font-size:14px}
.card{background:linear-gradient(var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.status{display:flex;gap:14px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dim);flex:none;box-shadow:0 0 0 5px rgba(255,255,255,.05)}
.dot.ok{background:var(--green2);box-shadow:0 0 0 5px rgba(67,214,128,.15)}
.dot.wait{background:var(--warn);animation:pulse 1.2s infinite}
.dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.step{display:flex;gap:14px}
.num{width:30px;height:30px;border-radius:50%;background:rgba(88,101,242,.2);color:var(--accent2);font-weight:700;display:grid;place-items:center;flex:none}
.step.done .num{background:var(--green);color:#fff}
h2{font-size:17px;margin-bottom:6px}
ol{padding-left:20px;color:var(--dim);display:flex;flex-direction:column;gap:6px;margin-top:8px}
ol b,p b{color:var(--text)}
code{background:rgba(255,255,255,.08);border-radius:7px;padding:2px 7px;font-size:14px;color:var(--text)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 18px;font:600 16px system-ui,sans-serif;
  color:#fff;background:linear-gradient(var(--accent2),var(--accent));text-decoration:none;cursor:pointer;margin-top:14px;box-shadow:0 6px 20px rgba(88,101,242,.35)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none}
.btn.danger{background:rgba(237,66,69,.18);color:#ff8a8c;box-shadow:none}
.btn:disabled{opacity:.5}
.copy{border:0;background:rgba(255,255,255,.1);color:var(--text);border-radius:8px;padding:2px 9px;font-size:13px;margin-left:6px;cursor:pointer}
label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
input{width:100%;background:#15171d;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:16px system-ui,sans-serif;outline:none}
input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(121,132,255,.25)}
input.bad{border-color:var(--red)}
details summary{cursor:pointer;color:var(--dim);font-size:14px;margin-top:14px;list-style:none}
details summary::before{content:"›";display:inline-block;margin-right:8px;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
.fav{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;margin-top:8px}
.fav button{border:0;background:rgba(255,255,255,.08);color:var(--dim);border-radius:10px;width:44px;font-size:18px;cursor:pointer}
.note{font-size:13px;color:var(--dim);margin-top:10px}
.alert{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;background:rgba(240,190,90,.12);color:var(--warn)}
.hidden{display:none}
.success{text-align:center;padding:26px 18px}
.success .big{font-size:44px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M19.6 5.2A17 17 0 0 0 15.4 4l-.5 1a15.7 15.7 0 0 0-5.8 0L8.6 4a17 17 0 0 0-4.2 1.3C1.7 9.2 1 13 1.3 16.8A17 17 0 0 0 6.5 19.5l1.1-1.8a11 11 0 0 1-1.7-.8l.4-.3a12.2 12.2 0 0 0 11.4 0l.4.3a11 11 0 0 1-1.7.8l1.1 1.8a17 17 0 0 0 5.2-2.7c.4-4.4-.7-8.2-3.1-11.6ZM8.5 14.5c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1Zm7 0c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1Z"/></svg></div>
    <div><h1 data-t="title"></h1><div class="sub" data-t="subtitle"></div></div>
  </header>

  <section class="card status"><span id="dot" class="dot wait"></span><div><b id="st-title"></b><div class="sub" id="st-text"></div></div></section>

  <section id="done" class="card success hidden">
    <div class="big">🎉</div>
    <h2 id="done-title"></h2>
    <p class="sub" data-t="done_text"></p>
    <button class="btn danger" id="logout" data-t="logout"></button>
  </section>

  <div id="steps">
    <section class="card step" id="s1"><span class="num">1</span><div>
      <h2 data-t="s1_title"></h2><p class="sub" data-t="s1_text"></p>
      <ol><li data-t="s1_a"></li><li data-t="s1_b"></li></ol>
      <a class="btn" href="https://discord.com/developers/applications" target="_blank" rel="noopener noreferrer" data-t="s1_button"></a>
    </div></section>

    <section class="card step" id="s2" style="margin-top:14px"><span class="num">2</span><div>
      <h2 data-t="s2_title"></h2>
      <ol>
        <li data-t="s2_a"></li>
        <li><span data-t="s2_b"></span> <code>http://127.0.0.1</code><button class="copy" data-copy="http://127.0.0.1" data-t="copy"></button></li>
        <li data-t="s2_c"></li>
        <li data-t="s2_d"></li>
      </ol>
    </div></section>

    <section class="card step" id="s3" style="margin-top:14px"><span class="num">3</span><div style="flex:1;min-width:0">
      <h2 data-t="s3_title"></h2>
      <label for="client-id" data-t="client_id"></label>
      <input id="client-id" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="123456789012345678">
      <div id="secret-alert" class="alert hidden" data-t="secret_needed"></div>
      <details id="secret-box"><summary data-t="secret_summary"></summary>
        <label for="secret" data-t="secret_label"></label>
        <input id="secret" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="note" id="secret-note"></p>
        <button class="btn danger hidden" id="clear-secret" type="button" data-t="secret_clear"></button>
      </details>
      <details id="fav-box"><summary data-t="fav_summary"></summary>
        <p class="note" data-t="fav_help"></p>
        <div id="favs"></div>
        <button class="btn ghost" id="add-fav" type="button" data-t="fav_add"></button>
      </details>
      <button class="btn" id="save" data-t="save"></button>
    </div></section>

    <section class="card step" id="s4" style="margin-top:14px"><span class="num">4</span><div>
      <h2 data-t="s4_title"></h2><p class="sub" data-t="s4_text"></p>
    </div></section>
  </div>
  <footer data-t="footer"></footer>
</main>
<script>
"use strict";
const T={
 en:{title:"Discord on your TV",subtitle:"Batocera setup · 2 minutes",
  s1_title:"Create your Discord application",s1_text:"Discord only lets local apps control voice chat through an application you own. It is free and private.",
  s1_a:"Open the developer portal and log in with your usual Discord account.",s1_b:"Click <b>New Application</b>, name it <b>Batocera</b>, accept and <b>Create</b>.",s1_button:"Open the Discord developer portal",
  s2_title:"Set it up in the OAuth2 tab",s2_a:"In the left menu, open <b>OAuth2</b>.",s2_b:"Under <b>Redirects</b>, add",s2_c:"Turn on <b>Public Client</b> (no secret needed this way).",s2_d:"Click <b>Save Changes</b>, then copy the <b>Client ID</b>.",
  s3_title:"Paste your Client ID",client_id:"Client ID",save:"Save and connect",saving:"Saving…",
  secret_summary:"Advanced: client secret",secret_label:"Client secret (only if Public Client is off)",
  secret_needed:"Discord asks for a client secret: turn on Public Client in OAuth2 (recommended), or paste the secret below.",
  secret_kept:"A secret is stored on the console. Leave empty to keep it.",secret_clear:"Forget the stored secret",secret_none:"Not needed when Public Client is on.",
  fav_summary:"Favorite friends (optional)",fav_help:"To call a friend from the TV, add the ID of your private conversation: Discord → Settings → Advanced → Developer Mode, then long-press the conversation → Copy Channel ID.",
  fav_add:"+ Add a friend",fav_name:"Name",fav_id:"Conversation ID",
  s4_title:"Accept on the TV",s4_text:"Discord shows an authorization request on the TV. Move the pointer with the left stick and click Authorize with the confirm button.",
  copy:"Copy",copied:"Copied",done_text:"Press the Share / Capture button of your controller to open Discord. You can close this page.",
  done_title:"Connected as {name}",logout:"Log out of this console",bad_id:"A Client ID is a number of 15 to 22 digits.",
  footer:"This page only works on your local network and closes by itself after 15 minutes.",
  st:{starting:["Starting…",""],no_config:["Waiting for your settings","Follow the steps below."],no_discord:["Discord is not installed","Install it from the panel on the TV."],
   installing:["Installing Discord…","{p}%"],launching:["Starting Discord","Log in once in the Discord window on the TV."],connecting:["Connecting…",""],
   authorize:["Look at the TV","Accept the Discord authorization request."],ready:["Connected","Everything is ready."],error:["Something went wrong",""]},
  offline:["The console does not answer","Is it still on? This page may have expired: show the QR code again."]},
 fr:{title:"Discord sur ta TV",subtitle:"Configuration Batocera · 2 minutes",
  s1_title:"Crée ton application Discord",s1_text:"Discord ne laisse piloter le vocal qu'à travers une application qui t'appartient. C'est gratuit et privé.",
  s1_a:"Ouvre le portail développeur et connecte-toi avec ton compte Discord habituel.",s1_b:"Clique sur <b>New Application</b>, nomme-la <b>Batocera</b>, accepte puis <b>Create</b>.",s1_button:"Ouvrir le portail développeur Discord",
  s2_title:"Règle-la dans l'onglet OAuth2",s2_a:"Dans le menu de gauche, ouvre <b>OAuth2</b>.",s2_b:"Dans <b>Redirects</b>, ajoute",s2_c:"Active <b>Public Client</b> (ainsi, pas besoin de secret).",s2_d:"Clique sur <b>Save Changes</b>, puis copie le <b>Client ID</b>.",
  s3_title:"Colle ton Client ID",client_id:"Client ID",save:"Enregistrer et connecter",saving:"Enregistrement…",
  secret_summary:"Avancé : secret client",secret_label:"Secret client (seulement si Public Client est désactivé)",
  secret_needed:"Discord demande un secret : active Public Client dans OAuth2 (recommandé), ou colle le secret ci-dessous.",
  secret_kept:"Un secret est enregistré sur la console. Laisse vide pour le garder.",secret_clear:"Oublier le secret enregistré",secret_none:"Inutile si Public Client est activé.",
  fav_summary:"Amis favoris (facultatif)",fav_help:"Pour appeler un ami depuis la TV, ajoute l'identifiant de votre conversation privée : Discord → Paramètres → Avancés → Mode développeur, puis appui long sur la conversation → Copier l'identifiant du salon.",
  fav_add:"+ Ajouter un ami",fav_name:"Nom",fav_id:"ID de la conversation",
  s4_title:"Accepte sur la TV",s4_text:"Discord affiche une demande d'autorisation sur la TV. Déplace le pointeur avec le stick gauche et clique sur Autoriser avec le bouton de validation.",
  copy:"Copier",copied:"Copié",done_text:"Appuie sur le bouton Partage / Capture de ta manette pour ouvrir Discord. Tu peux fermer cette page.",
  done_title:"Connecté en tant que {name}",logout:"Déconnecter cette console",bad_id:"Un Client ID est un nombre de 15 à 22 chiffres.",
  footer:"Cette page ne fonctionne que sur ton réseau local et se ferme toute seule après 15 minutes.",
  st:{starting:["Démarrage…",""],no_config:["En attente de tes réglages","Suis les étapes ci-dessous."],no_discord:["Discord n'est pas installé","Installe-le depuis le panneau sur la TV."],
   installing:["Installation de Discord…","{p} %"],launching:["Démarrage de Discord","Connecte-toi une fois dans la fenêtre Discord sur la TV."],connecting:["Connexion…",""],
   authorize:["Regarde la TV","Accepte la demande d'autorisation de Discord."],ready:["Connecté","Tout est prêt."],error:["Un problème est survenu",""]},
  offline:["La console ne répond pas","Est-elle allumée ? La page a peut-être expiré : réaffiche le QR code."]}
};
const lang=(navigator.language||"en").slice(0,2)==="fr"?"fr":"en",L=T[lang];
document.documentElement.lang=lang;
document.querySelectorAll("[data-t]").forEach(e=>{e.innerHTML=L[e.dataset.t]??""});
const $=id=>document.getElementById(id),base=location.pathname.replace(/\/$/,"");
let loaded=false,saving=false;

async function api(path,body){
  const r=await fetch(base+path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{cache:"no-store"});
  if(!r.ok&&r.status!==400)throw new Error(r.status);
  return r.json();
}
function favRow(name="",id=""){
  const row=document.createElement("div");row.className="fav";
  row.innerHTML=`<input placeholder="${L.fav_name}" maxlength="40"><input placeholder="${L.fav_id}" inputmode="numeric"><button type="button" aria-label="remove">×</button>`;
  const [n,i,b]=row.children;n.value=name;i.value=id;b.onclick=()=>row.remove();$("favs").append(row);
}
function render(s){
  const [title,text]=L.st[s.phase]||["",""];
  $("st-title").textContent=title;
  $("st-text").textContent=s.phase==="error"?s.error:text.replace("{p}",s.install_progress);
  $("dot").className="dot "+(s.phase==="ready"?"ok":s.phase==="error"?"err":"wait");
  const ready=s.phase==="ready"&&s.user;
  $("done").classList.toggle("hidden",!ready);$("steps").classList.toggle("hidden",!!ready);
  if(ready)$("done-title").textContent=L.done_title.replace("{name}",s.user.name);
  $("secret-alert").classList.toggle("hidden",!s.needs_secret);
  if(s.needs_secret)$("secret-box").open=true;
  $("secret-note").textContent=s.has_secret?L.secret_kept:L.secret_none;
  $("clear-secret").classList.toggle("hidden",!s.has_secret);
  ["s1","s2","s3"].forEach(id=>$(id).classList.toggle("done",!!s.client_id&&!s.needs_secret));
  if(!loaded){
    loaded=true;$("client-id").value=s.client_id||"";
    (s.favorites||[]).forEach(f=>favRow(f.name,f.channel_id));
    if((s.favorites||[]).length)$("fav-box").open=true;
  }
}
async function poll(){
  try{render(await api("/api/status"))}
  catch(e){$("st-title").textContent=L.offline[0];$("st-text").textContent=L.offline[1];$("dot").className="dot err"}
  setTimeout(poll,2000);
}
$("save").onclick=async()=>{
  const id=$("client-id").value.trim();
  if(!/^\d{15,22}$/.test(id)){$("client-id").classList.add("bad");$("st-text").textContent=L.bad_id;$("client-id").focus();return}
  $("client-id").classList.remove("bad");
  const favorites=[...$("favs").children].map(r=>({name:r.children[0].value.trim(),channel_id:r.children[1].value.trim()})).filter(f=>/^\d{15,22}$/.test(f.channel_id));
  saving=true;$("save").disabled=true;$("save").textContent=L.saving;
  try{await api("/api/config",{client_id:id,client_secret:$("secret").value,favorites});$("secret").value=""}
  finally{saving=false;$("save").disabled=false;$("save").textContent=L.save}
};
$("logout").onclick=()=>api("/api/logout",{});
$("clear-secret").onclick=()=>{const id=$("client-id").value.trim();if(/^\d{15,22}$/.test(id))api("/api/config",{client_id:id,clear_secret:true,favorites:[...$("favs").children].map(r=>({name:r.children[0].value.trim(),channel_id:r.children[1].value.trim()}))})};
$("add-fav").onclick=()=>favRow();
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
  try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent=L.copied;setTimeout(()=>b.textContent=L.copy,1500)}catch(e){}
});
poll();
</script>
</body>
</html>
