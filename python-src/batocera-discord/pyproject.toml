[project]
name = "batocera-discord"
version = '44.0'
# pygame is provided by buildroot (python-pygame2); pygame-ce is used for type checking only (see root dev group)
dependencies = [
    'evdev; sys_platform == "linux"',
    'qrcode',
]

[project.scripts]
batocera-discord = "batocera_discord.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_discord"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib", "--cov=batocera_discord", "--cov-branch", "--cov-report=term"]
strict = true
