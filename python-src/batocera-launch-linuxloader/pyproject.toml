[project]
name = "batocera-launch-linuxloader"
version = '44.0'
dependencies = [
    'batocera-common',
    'batocera-launch',
    'evdev; sys_platform == "linux"',
]

[project.entry-points."batocera_launch.emulators"]
linuxloader = 'batocera_launch_linuxloader:LinuxLoader'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_linuxloader"]
