[project]
name = "batocera-common"
version = '44.0'
requires-python = "==3.14.5"
dependencies = [
    'typing-extensions',
    'PyYAML',
    'ruamel.yaml',
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_common"]

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib", "--cov=batocera_common", "--cov-branch", "--cov-report=term"]
strict = true
