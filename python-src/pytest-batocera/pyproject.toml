[project]
name = "pytest-batocera"
version = '1.0'
license = 'LGPL-3.0-or-later'
requires-python = "==3.14.5"
dependencies = [
    'pytest',
    'pytest-asyncio',
]

[project.entry-points.pytest11]
batocera = "pytest_batocera.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/pytest_batocera"]
