[project]
name = "batocera-launch-pcsx2"
version = '44.0'
dependencies = [
    'batocera-common',
    'batocera-launch',
]

[project.entry-points."batocera_launch.emulators"]
pcsx2 = 'batocera_launch_pcsx2:Pcsx2'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_pcsx2"]
