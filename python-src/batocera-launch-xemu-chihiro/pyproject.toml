[project]
name = "batocera-launch-xemu-chihiro"
version = '44.0'
dependencies = [
    'batocera-common',
    'batocera-launch',
    'toml',
]

[project.entry-points."batocera_launch.emulators"]
xemu-chihiro = 'batocera_launch_xemu_chihiro:XemuChihiro'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_launch_xemu_chihiro"]
